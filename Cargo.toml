[package]
name = "bake-license"
version = "0.2.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/core-rs/bake-license"
description = "License and copyright maintenance tasks for Bake"
readme = "readme.md"
include = ["src/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["core-rs/maintainers"]

[lib]
name = "bake_license"

[dependencies]
core-markdown = "0.2.0"
bake = "0"
tempfile = "3.27"

[patch.crates-io]
bake-license = { path = "." }
